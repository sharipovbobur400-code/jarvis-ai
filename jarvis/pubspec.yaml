name: jarvis
description: JARVIS — Personal AI Computer Assistant (Desktop + Remote).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.5.0
  web_socket_channel: ^3.0.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0
  crypto: ^3.0.3
  uuid: ^4.4.0
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  http: ^1.2.1
  url_launcher: ^6.3.0
  device_info_plus: ^10.1.0
  window_manager: ^0.4.2

  # Mobile-only voice packages (guarded at runtime by platform checks)
  speech_to_text: ^6.6.2
  flutter_tts: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
