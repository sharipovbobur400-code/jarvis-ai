name: jarvis_ai
description: "JARVIS — Personal AI Computer Assistant for Windows Desktop & Android Remote"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Architecture
  flutter_riverpod: ^2.5.1

  # Networking & HTTP
  dio: ^5.4.3+1
  web_socket_channel: ^2.4.5
  shelf: ^1.4.1
  shelf_web_socket: ^1.0.4

  # Storage & Security
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3
  crypto: ^3.0.3

  # Audio, Speech & Voice
  flutter_tts: ^4.0.2
  speech_to_text: ^6.6.0

  # Utilities & System Integration
  path_provider: ^2.1.3
  path: ^1.9.0
  url_launcher: ^6.3.0
  device_info_plus: ^10.1.0
  qr_flutter: ^4.1.0
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
